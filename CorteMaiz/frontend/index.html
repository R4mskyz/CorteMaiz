<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Barbearia Code | Agendamentos</title>
  <style>
    :root{--bg:#121214;--card:#202024;--primary:#ff9000;--text:#f4ede8;--muted:#aaa;--border:#3e3b47;--error:#c62828;--ok:#2e7d32}*{box-sizing:border-box;font-family:Segoe UI,Arial,sans-serif}body{margin:0;background:var(--bg);color:var(--text);padding:24px}.container{max-width:900px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:20px}h1{grid-column:1/-1;text-align:center;color:var(--primary)}h2{color:var(--primary);margin-top:0}.card{background:var(--card);padding:24px;border:1px solid var(--border);border-radius:10px}label{display:block;margin:14px 0 6px;color:var(--muted)}input,select,button{width:100%;padding:12px;border-radius:8px;font-size:16px}input,select{background:var(--bg);border:1px solid var(--border);color:var(--text)}button{margin-top:18px;background:var(--primary);border:0;color:#252129;font-weight:700;cursor:pointer}.toast{display:none;grid-column:1/-1;padding:12px;text-align:center;border-radius:8px}.toast.show{display:block}.toast.success{background:var(--ok)}.toast.error{background:var(--error)}.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px;margin-top:16px}.slot{padding:10px;text-align:center;border:1px solid var(--border);border-radius:6px}.slot.busy{color:#ff8a80;background:#5c2020;text-decoration:line-through}@media(max-width:768px){.container{grid-template-columns:1fr}}
  </style>
</head>
<body><main class="container"><h1>BARBEARIA CODE</h1><div id="toast" class="toast"></div>
  <section class="card"><h2>Buscar disponibilidade</h2><label>Barbeiro<select id="search-professional"><option value="1">Carlos</option><option value="2">Manoel</option></select></label><label>Data<input type="date" id="search-date" required></label><button id="search">Consultar horários</button><div id="slots" class="slots"></div></section>
  <section class="card"><h2>Novo agendamento</h2><form id="booking-form"><label>ID do cliente<input id="customer" type="number" value="1" required></label><label>Barbeiro<select id="professional"><option value="1">Carlos</option><option value="2">Manoel</option></select></label><label>Serviço<select id="service"><option value="1">Corte simples — 30 min</option><option value="2">Barba completa — 30 min</option><option value="3">Combo cabelo e barba — 60 min</option></select></label><label>Data e hora<input id="start" type="datetime-local" required></label><button>Confirmar horário</button></form></section>
</main><script>
const toast=document.querySelector('#toast'),date=document.querySelector('#search-date'),start=document.querySelector('#start'),customer=document.querySelector('#customer'),professional=document.querySelector('#professional'),service=document.querySelector('#service');
function ymd(value){return value.getFullYear()+'-'+String(value.getMonth()+1).padStart(2,'0')+'-'+String(value.getDate()).padStart(2,'0')}
const today=new Date(),lastDay=new Date(today.getFullYear(),today.getMonth()+2,0),minDate=ymd(today),maxDate=ymd(lastDay);date.min=minDate;date.max=maxDate;date.value=minDate;start.min=minDate+'T09:00';start.max=maxDate+'T18:00';
function feedback(message,type){toast.textContent=message;toast.className='toast show '+type;setTimeout(()=>toast.className='toast',5000)}
function slots(busy){const box=document.querySelector('#slots');box.innerHTML='';for(let h=9;h<18;h++)for(let m=0;m<60;m+=30){const datetime=date.value+'T'+String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':00',d=new Date(datetime),el=document.createElement('button');el.type='button';el.className='slot';el.textContent=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});if(busy.some(b=>d>=new Date(b.start)&&d<new Date(b.end))){el.classList.add('busy');el.disabled=true}else el.onclick=()=>{start.value=datetime.slice(0,16);professional.value=document.querySelector('#search-professional').value;feedback('Horário selecionado. Confirme seu agendamento.','success')};box.append(el)}}
async function availability(){try{const p=document.querySelector('#search-professional').value,r=await fetch(`/appointments/professionals/${p}/availability?target_date=${date.value}`),data=await r.json();if(!r.ok)throw Error(data.detail);slots(data.busy_slots)}catch(error){feedback(error.message||'Não foi possível consultar a agenda.','error')}}
document.querySelector('#search').onclick=availability;date.onchange=availability;document.querySelector('#booking-form').onsubmit=async e=>{e.preventDefault();try{const body={customer_id:+customer.value,professional_id:+professional.value,service_id:+service.value,start_time:start.value};const r=await fetch('/appointments/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),data=await r.json();if(!r.ok)throw Error(data.detail);feedback('Agendamento confirmado e salvo no banco de dados.','success');date.value=start.value.slice(0,10);await availability()}catch(err){feedback(err.message||'Não foi possível criar o agendamento.','error')}};availability();
</script></body></html>
